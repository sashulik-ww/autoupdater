name: Auto Check Proxies

on:
  schedule:
    - cron: '0 */4 * * *' # Запуск каждый 1 час
  workflow_dispatch: # Возможность запустить вручную кнопкой

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run verification script
        run: python checker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vpn-configs-checked/1.txt
          git commit -m "Auto-update working proxies in vpn-configs-checked/1.txt" || exit 0
          git push
